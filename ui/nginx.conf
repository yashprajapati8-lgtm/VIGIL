# VIGIL console. One origin for the browser: static files plus a proxy to each
# backend, so there is no CORS and the operator token never leaves this origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS, looked up per request (via the variables below) so nginx
    # starts even if a backend is down and follows a restarted container's new IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $engine http://vigil-engine:8080;
    set $chaos  http://chaos-controller:8090;
    set $shop   http://payment:8000;
    set $storefront http://loadgen:8000;
    set $tunnel http://cloudflared:2000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Live stream: never buffer, keep the connection open.
    location = /api/stream {
        proxy_pass $engine;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Demo shop: /api/store/pay -> payment:8000/pay (a real checkout).
    location /api/store/ {
        rewrite ^/api/store/(.*)$ /$1 break;
        proxy_pass $shop;
        proxy_read_timeout 10s;
    }

    # Phone checkout (demo, no real money): /api/phone/pay -> loadgen:8000/phone/pay.
    # The storefront runs it, so a phone is one more customer on the same path.
    location /api/phone/ {
        rewrite ^/api/phone/(.*)$ /phone/$1 break;
        proxy_pass $storefront;
        proxy_read_timeout 10s;
    }

    # The public tunnel's address, if one is running (docker compose --profile public),
    # so the phone page can put it in the QR code. 502 when there is no tunnel.
    location = /api/tunnel {
        proxy_pass $tunnel/quicktunnel;
        proxy_read_timeout 3s;
    }

    # Engine API.
    location /api/ {
        proxy_pass $engine;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
    }

    # Chaos Lab: /chaos/scenarios -> chaos-controller:8090/scenarios.
    # The engine has no code path or token for this; only the browser uses it.
    location /chaos/ {
        rewrite ^/chaos/(.*)$ /$1 break;
        proxy_pass $chaos;
        proxy_read_timeout 15s;
    }

    # Proving Ground results, written by the proving-ground container (read-only mount).
    location /proving-ground/ {
        alias /usr/share/nginx/proving-ground/;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path renders index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# Public phone gateway. The only thing a public tunnel points at: the phone checkout
# page and the three routes it needs. The console, Chaos Lab, the engine API and the
# operator controls are not served here at all, so a shared link can't reach them.
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $storefront http://loadgen:8000;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = / { return 302 /pay; }

    location = /pay {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/(favicon\.png|vigil-mark\.png|og\.jpg|robots\.txt)$ {
        try_files $uri =404;
    }

    # Demo checkout only: hello, pay, and VIGIL's read-only summary. Not the phone list.
    location ~ ^/api/phone/(hello|pay|vigil)$ {
        rewrite ^/api/phone/(.*)$ /phone/$1 break;
        proxy_pass $storefront;
        proxy_read_timeout 10s;
    }

    location / { return 404; }
}
